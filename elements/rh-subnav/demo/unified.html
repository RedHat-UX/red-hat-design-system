---
description: Block-end pill indicator on rh-navigation-link inside rh-subnav, using the indicator CSS custom property hooks.
---
<style>

            var(--unified-color-interactive-fill-plain-on-dark)

      --unified-color-interactive-fill-plain-alt-hover: light-dark(#ffffff, #292929);
      --unified-color-text-interactive-default:
        light-dark(
            var(--unified-color-blue-50),
            var(--unified-color-blue-20)
          );
      --unified-color-text-interactive-hover:
        light-dark(
            var(--unified-color-blue-60),
            var(--unified-color-blue-10)
          );

        light-dark(
            var(--unified-color-blue-60),
            var(--unified-color-blue-10)
          );
      --unified-color-text-interactive-active:
        light-dark(
            var(--unified-color-blue-60),
            var(--unified-color-blue-10)
          );
      --unified-color-icon-interactive-default:
        light-dark(
            var(--unified-color-blue-50),
            var(--unified-color-blue-20)
          );
      --unified-color-icon-interactive-hover:

          );
      --unified-color-icon-interactive-focus:

      --unified-color-icon-interactive-active:

            var(--unified-color-blue-20)

      --unified-color-border-interactive-subtle-active:
        light-dark(

            var(--unified-color-blue-20)

            var(--unified-color-gray-50),
            var(--unified-color-gray-70)
          );
      --unified-color-icon-status-on-disabled:

            var(--unified-color-gray-50),
            var(--unified-color-gray-70)
          );
      --unified-color-text-status-disabled:

            var(--unified-color-gray-40),
            var(--unified-color-gray-50)
          );
      --unified-color-icon-status-disabled:

            var(--unified-color-red-orange-70),
            var(--unified-color-red-orange-20)

      --unified-color-text-status-danger-active:
        light-dark(
            var(--unified-color-red-orange-70),
            var(--unified-color-red-orange-20)

      --unified-color-icon-status-danger-hover:

            var(--unified-color-red-orange-70),
            var(--unified-color-red-orange-40)

            var(--unified-color-red-orange-40)

            var(--unified-color-red-orange-40)

      --unified-color-status-warning-hover:
        light-dark(
            var(--unified-color-yellow-40),
            var(--unified-color-yellow-20)
          );

        light-dark(
            var(--unified-color-yellow-40),
            var(--unified-color-yellow-20)

            var(--unified-color-yellow-20)
          );
      --unified-color-border-status-warning-focus:

            var(--unified-color-yellow-20)

        light-dark(
            var(--unified-color-yellow-50),
            var(--unified-color-yellow-20)

      --unified-color-status-success-hover:
        light-dark(
            var(--unified-color-green-70),
            var(--unified-color-green-30)
          );
      --unified-color-status-success-focus:
        light-dark(
            var(--unified-color-green-70),
            var(--unified-color-green-30)
          );
      --unified-color-status-success-active:
        light-dark(
            var(--unified-color-green-70),
            var(--unified-color-green-30)
          );
      --unified-color-border-status-success-hover:
        light-dark(
            var(--unified-color-green-70),
            var(--unified-color-green-30)
          );
      --unified-color-border-status-success-focus:
        light-dark(
            var(--unified-color-green-70),
            var(--unified-color-green-30)
          );
      --unified-color-border-status-success-active:
        light-dark(
            var(--unified-color-green-70),
            var(--unified-color-green-30)

          );

        light-dark(
            var(--unified-color-purple-60),
            var(--unified-color-purple-20)
          );
      --unified-color-status-info-active:

            var(--unified-color-purple-60),
            var(--unified-color-purple-20)

      /* Status colors: Custom */
      --unified-color-status-custom:
        light-dark(
            var(--unified-color-teal-60),
            var(--unified-color-teal-40)
          );
      --unified-color-status-custom-hover:
        light-dark(
            var(--unified-color-teal-70),
            var(--unified-color-teal-30)
          );
      --unified-color-status-custom-focus:
        light-dark(
            var(--unified-color-teal-70),
            var(--unified-color-teal-30)

      --unified-color-status-custom-active:
        light-dark(
            var(--unified-color-teal-70),
            var(--unified-color-teal-30)

      --unified-color-border-status-custom-hover:

            var(--unified-color-teal-70),
            var(--unified-color-teal-30)

      --unified-color-border-status-custom-focus:

        light-dark(
            var(--unified-color-gray-20),
            var(--unified-color-gray-60)

      /* Brand accent */
      --unified-color-brand-accent:
        light-dark(
            var(--unified-color-blue-50),
            var(--unified-color-blue-30)

      --unified-border-radius-default: 16px;
      --unified-border-radius-large: 24px;
      --unified-border-radius-pill: 64px;

            + var(--unified-space-xs)

      --unified-border-width-sm: 1px;
      --unified-border-width-md: 2px;
      --unified-border-width-lg: 3px;

      /* Dimensions */
      --unified-size-icon-00: 14px; /* 0.875rem */
      --unified-space-xs: 4px;
      --unified-space-sm: 6px;
      --unified-space-md: 8px;
      --unified-space-lg: 16px;

  rh-subnav {
    --rh-navigation-link-border-radius: var(--unified-border-radius-pill);
    --rh-navigation-link-background-color-hover: var(--unified-color-interactive-fill-plain-alt-hover);
    --rh-navigation-link-indicator-border-radius: var(--unified-border-radius-pill);
    --rh-navigation-link-white-space: nowrap;

    --rh-subnav-indicator-inset: auto 0 0 0;
    --rh-subnav-link-padding-block: 4px;
    --rh-subnav-link-padding-inline: 16px;
    --rh-subnav-scroll-buttons-border-block-end: none;
    --rh-subnav-scroll-buttons-padding: var(--unified-space-md);


    background-color: light-dark(var(--unified-color-gray-10), var(--unified-color-gray-95));
    border-radius: var(--unified-border-radius-pill);
    padding-inline: var(--unified-space-md);

    &::part(container) {
      padding: var(--unified-space-xs) 0 0 0;
    }

    &::part(links) {
      display: flex;
      gap: var(--unified-space-xs);
      padding: 0 var(--unified-space-xs);
    }

    & rh-navigation-link {
      row-gap: var(--unified-space-xs);

      &:hover {
        border-radius: var(--unified-border-radius-pill);
      }

      &[current-page] {
        --rh-navigation-link-background-color: var(--unified-color-interactive-fill-plain-alt-hover);

        border-radius: var(--unified-border-radius-pill);
      }
    }

<script type="module">
  import '@rhds/elements/rh-subnav/rh-subnav.js';
  import '@rhds/elements/rh-navigation-link/rh-navigation-link.js';
</script>
